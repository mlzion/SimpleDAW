name: Windows prototype

on:
  push:
    branches: [feature/phase1-audio-engine]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64
      - name: Build
        run: cmake --build build --config Release --parallel 2
      - name: Smoke test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Inspect and launch standalone executable
        run: ./scripts/Verify-Portable.ps1 -Executable build/SimpleDAW_artefacts/Release/SimpleDAW.exe
