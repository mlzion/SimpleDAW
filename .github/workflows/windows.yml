name: Windows x64

on:
  # CI is deliberately dispatched after the design clarification gate.
  # PR creation and documentation-only commits must not start Windows builds.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Windows x64 (/MD)
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned source dependencies
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DSIMPLEDAW_ASIO_SDK:PATH= -DSIMPLEDAW_MSVC_DYNAMIC_RUNTIME=ON
      - name: Create matching source archive
        run: |
          ./scripts/New-WindowsSourceArchive.ps1 -BinaryBuildDirectory build -OutputDirectory source-package |
            Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append
      - name: Extract matching source archive
        run: |
          New-Item -Path archive-source -ItemType Directory | Out-Null
          tar.exe -xzf source-package/SimpleDAW-Windows-x64-source.tar.gz -C archive-source
          if ($LASTEXITCODE -ne 0) { throw 'Could not extract the source archive.' }
      - name: Configure from extracted source without dependency downloads
        run: >
          cmake -S archive-source/SimpleDAW -B archive-build -G "Visual Studio 17 2022" -A x64
          -DSIMPLEDAW_ASIO_SDK:PATH= -DSIMPLEDAW_MSVC_DYNAMIC_RUNTIME=ON -DFETCHCONTENT_FULLY_DISCONNECTED=ON
          "-DFETCHCONTENT_SOURCE_DIR_JUCE=${{ github.workspace }}/archive-source/JUCE"
          "-DFETCHCONTENT_SOURCE_DIR_TRACKTION=${{ github.workspace }}/archive-source/Tracktion"
      - name: Build
        run: cmake --build archive-build --config Release --parallel 2
      - name: Smoke test
        id: smoke
        run: ctest --test-dir archive-build -C Release --output-on-failure
      - name: Repeat Inspector Clone regression
        id: clone_repeat
        run: ctest --test-dir archive-build -C Release -R '^inspector_clone$' --repeat until-fail:10 --output-on-failure
      - name: Diagnose Inspector Clone fail-fast
        if: failure() && (steps.smoke.outcome == 'failure' || steps.clone_repeat.outcome == 'failure')
        shell: pwsh
        run: |
          $failed = 'archive-build/Testing/Temporary/LastTestsFailed.log'
          if (!(Test-Path $failed) -or !(Select-String -LiteralPath $failed -Pattern ':inspector_clone$' -Quiet)) { exit 0 }
          $exe = (Get-Content -LiteralPath archive-build/SimpleDAW-Release.json -Raw | ConvertFrom-Json).executable
          $exeName = [regex]::Escape((Split-Path -Leaf $exe))
          Get-WinEvent -FilterHashtable @{
            LogName = 'Application'; Id = 1000, 1001; StartTime = (Get-Date).AddMinutes(-10)
          } -ErrorAction SilentlyContinue |
            Where-Object { $_.Message -match $exeName } |
            Select-Object -First 6 -ExpandProperty Message
          $cdb = Get-Item "C:/Program Files (x86)/Windows Kits/10/Debuggers/x64/cdb.exe" -ErrorAction SilentlyContinue
          if (!$cdb) {
            Write-Warning 'Windows SDK cdb is unavailable. Review the Inspector Clone checkpoints and Application event log above.'
            exit 0
          }
          $debugDir = New-Item -ItemType Directory -Path "$env:RUNNER_TEMP/SimpleDAW-Clone-Debug" -Force
          $commands = Join-Path $debugDir 'commands.txt'
          @'
          sxe -c ".lastevent; .exr -1; .ecxr; kv; q" 0xc0000409
          g
          '@ | Set-Content -LiteralPath $commands -Encoding ascii
          $log = Join-Path $debugDir 'debugger.log'
          $debugger = Start-Process -FilePath $cdb.FullName -ArgumentList @(
            '-G', '-cf', ('"{0}"' -f $commands), ('"{0}"' -f $exe), '--inspector-clone-test'
          ) -RedirectStandardOutput $log -RedirectStandardError (Join-Path $debugDir 'debugger-error.log') -PassThru
          if (!$debugger.WaitForExit(60000)) {
            taskkill.exe /PID $debugger.Id /T /F
            Write-Warning 'Inspector Clone diagnostic rerun exceeded 60 seconds.'
          }
          Get-Content -LiteralPath $log
          Get-Content -LiteralPath (Join-Path $debugDir 'debugger-error.log')

      - name: Verify version, runtime imports and isolated startup
        id: release
        run: |
          ./scripts/Verify-Portable.ps1 -BuildDirectory archive-build -MsvcRuntime MD
          $metadata = Get-Content -LiteralPath archive-build/SimpleDAW-Release.json -Raw | ConvertFrom-Json
          "artifact=$($metadata.artifactName)" >> $env:GITHUB_OUTPUT
          $exeName = Split-Path -Leaf $metadata.executable
          $hash = (Get-FileHash -LiteralPath $metadata.executable).Hash
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "$exeName (/MD) SHA256 $hash"
      - name: Stage executable, corresponding source and notices
        if: github.repository == 'mlzion/SimpleDAW'
        run: |
          New-Item -Path windows-download -ItemType Directory | Out-Null
          $metadata = Get-Content -LiteralPath archive-build/SimpleDAW-Release.json -Raw | ConvertFrom-Json
          $payload = @(
            $metadata.executable
            'source-package/SimpleDAW-Windows-x64-source.tar.gz'
            'archive-source/SimpleDAW/LICENSE'
            'archive-source/SimpleDAW/COPYRIGHT'
            'archive-source/SimpleDAW/THIRD_PARTY_NOTICES.md'
            'archive-source/BUILD.md'
            'archive-source/SOURCE-REVISIONS.txt'
            'archive-source/SimpleDAW/docs/windows-download.md'
          )
          foreach ($file in $payload) {
            Copy-Item -LiteralPath $file -Destination windows-download -ErrorAction Stop
          }
          $drumSamples = Join-Path (Split-Path -Parent $metadata.executable) 'Drum Samples'
          Copy-Item -LiteralPath $drumSamples -Destination windows-download -Recurse -ErrorAction Stop
      - name: Upload Windows x64 download
        if: github.repository == 'mlzion/SimpleDAW'
        id: download
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.release.outputs.artifact }}
          path: windows-download/
          if-no-files-found: error
          compression-level: 0
      - name: Link the executable and corresponding source download
        if: steps.download.outputs.artifact-url != ''
        run: |
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value '[Download ${{ steps.release.outputs.artifact }}.zip](${{ steps.download.outputs.artifact-url }})'
