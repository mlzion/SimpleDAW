name: Windows LLVM MinGW investigation

on:
  push:
    branches: [feature/phase1-audio-engine]
    paths:
      - '.github/workflows/windows-llvm-mingw.yml'
      - 'scripts/Install-LlvmMinGW.ps1'
      - 'CMakeLists.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned LLVM MinGW
        run: |
          $bin = ./scripts/Install-LlvmMinGW.ps1 -Destination "$env:RUNNER_TEMP/llvm-mingw"
          Add-Content -LiteralPath $env:GITHUB_PATH -Value $bin
      - name: Build and inspect a static C++ runtime probe
        run: |
          @'
          #include <stdexcept>
          #include <string>
          #include <thread>
          int main(int argc, char** argv)
          {
              std::string value;
              std::thread worker([&] { value = argv[0]; });
              worker.join();
              try { throw std::runtime_error(value); }
              catch (const std::exception& error) { return argc == 1 && *error.what() ? 0 : 1; }
          }
          '@ | Set-Content runtime-probe.cpp
          x86_64-w64-mingw32-clang++ --version
          x86_64-w64-mingw32-clang++ -std=c++20 -static -Wl,--trace runtime-probe.cpp -o runtime-probe.exe
          if ($LASTEXITCODE -ne 0) { throw 'Could not build the runtime probe.' }
          llvm-readobj --coff-imports runtime-probe.exe
          if ($LASTEXITCODE -ne 0) { throw 'Could not inspect the runtime probe.' }
          $env:PATH = Join-Path $env:SystemRoot System32
          ./runtime-probe.exe
          if ($LASTEXITCODE -ne 0) { throw 'The standalone runtime probe failed.' }
      - name: Fetch pinned source dependencies
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DSIMPLEDAW_ASIO_SDK:PATH=
      - name: Create and extract matching source archive
        run: |
          ./scripts/New-WindowsSourceArchive.ps1 -BinaryBuildDirectory build -OutputDirectory source-package |
            Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append
          New-Item -Path archive-source -ItemType Directory | Out-Null
          tar.exe -xzf source-package/SimpleDAW-Windows-x64-source.tar.gz -C archive-source
          if ($LASTEXITCODE -ne 0) { throw 'Could not extract the source archive.' }
      - name: Attempt LLVM MinGW configure from the archive
        id: configure
        run: |
          # juceaide starts a nested CMake configure without the parent compiler cache.
          $env:CC = (Get-Command x86_64-w64-mingw32-clang.exe).Source
          $env:CXX = (Get-Command x86_64-w64-mingw32-clang++.exe).Source
          $env:RC = (Get-Command x86_64-w64-mingw32-windres.exe).Source
          $PSNativeCommandUseErrorActionPreference = $false
          $compilerArgs = @(
            '-DCMAKE_C_COMPILER=x86_64-w64-mingw32-clang.exe',
            '-DCMAKE_CXX_COMPILER=x86_64-w64-mingw32-clang++.exe',
            '-DCMAKE_RC_COMPILER=x86_64-w64-mingw32-windres.exe',
            '-DCMAKE_BUILD_TYPE=Release',
            '-DCMAKE_EXE_LINKER_FLAGS=-static',
            '-DSIMPLEDAW_ASIO_SDK:PATH=',
            '-DFETCHCONTENT_FULLY_DISCONNECTED=ON',
            "-DFETCHCONTENT_SOURCE_DIR_JUCE=$PWD/archive-source/JUCE",
            "-DFETCHCONTENT_SOURCE_DIR_TRACKTION=$PWD/archive-source/Tracktion"
          )
          $output = & cmake -S archive-source/SimpleDAW -B clang-build -G Ninja @compilerArgs 2>&1
          $result = $LASTEXITCODE
          $output | Write-Output
          if ($result -eq 0) {
            'supported=true' >> $env:GITHUB_OUTPUT
          } elseif ($output -match 'MinGW is not supported') {
            'supported=false' >> $env:GITHUB_OUTPUT
            'LLVM/MinGW qualification blocked by JUCE: MinGW is not supported.' >> $env:GITHUB_STEP_SUMMARY
          } else {
            throw "LLVM/MinGW configure failed with exit code $result before the expected JUCE diagnostic."
          }
      - name: Build and test if configure succeeds
        if: steps.configure.outputs.supported == 'true'
        run: |
          cmake --build clang-build --parallel 2
          if ($LASTEXITCODE -ne 0) { throw 'LLVM/MinGW build failed.' }
          ctest --test-dir clang-build --output-on-failure
          if ($LASTEXITCODE -ne 0) { throw 'LLVM/MinGW smoke test failed.' }
          ./scripts/Verify-Portable.ps1 -Executable clang-build/SimpleDAW_artefacts/Release/SimpleDAW.exe
